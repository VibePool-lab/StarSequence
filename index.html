<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Space Numbers 1–10</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
}

#hud {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 10;
  color: white;
  background: rgba(0,0,0,0.4);
  padding: 12px;
  border-radius: 12px;
  min-width: 200px;
}

#hud div {
  margin: 6px 0;
}

#menu {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 20;
  background: rgba(0,0,0,0.5);
}

#panel {
  background: rgba(10,10,20,0.9);
  border: 1px solid rgba(255,255,255,0.2);
  padding: 28px;
  border-radius: 18px;
  text-align: center;
  color: white;
  width: 420px;
}

button {
  margin-top: 16px;
  padding: 12px 18px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  opacity: 0.9;
}
</style>
</head>

<body>

<div id="hud">
  <div>Next Number: <span id="next">1</span></div>
  <div>Collected: <span id="score">0 / 10</span></div>
  <div>Penalty: <span id="penalty">0</span>s</div>
</div>

<div id="menu">
  <div id="panel">
    <h1>Space Numbers 1–10</h1>
    <p>Click the numbers in the correct order.</p>
    <p>Move with WASD</p>
    <p>Hold mouse button and move mouse to look around.</p>
    <button id="startBtn">START</button>
  </div>
</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>

const hudNext = document.getElementById("next");
const hudScore = document.getElementById("score");
const hudPenalty = document.getElementById("penalty");

const menu = document.getElementById("menu");
const startBtn = document.getElementById("startBtn");

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000010, 0.02);

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.4));

const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5, 10, 8);
scene.add(light);

//
// STARFIELD
//

const starGeo = new THREE.BufferGeometry();
const starCount = 3000;

const starPositions = new Float32Array(starCount * 3);

for (let i = 0; i < starCount; i++) {
  const i3 = i * 3;

  starPositions[i3] = (Math.random() - 0.5) * 400;
  starPositions[i3 + 1] = (Math.random() - 0.5) * 400;
  starPositions[i3 + 2] = (Math.random() - 0.5) * 400;
}

starGeo.setAttribute(
  "position",
  new THREE.BufferAttribute(starPositions, 3)
);

const stars = new THREE.Points(
  starGeo,
  new THREE.PointsMaterial({
    size: 0.7
  })
);

scene.add(stars);

//
// PLAYER
//

const player = new THREE.Group();

const ship = new THREE.Mesh(
  new THREE.ConeGeometry(0.25, 0.9, 16),
  new THREE.MeshStandardMaterial({
    color: 0x88ccff
  })
);

ship.rotation.x = Math.PI / 2;

player.add(ship);

scene.add(player);

player.position.set(0, 0, 6);

//
// CAMERA
//

const camOffset = new THREE.Vector3(0, 1.2, 6);

//
// GAME STATE
//

let running = false;

let nextNumber = 1;
let collected = 0;
let penalty = 0;

//
// NUMBER ORBS
//

const numberOrbs = [];

function createNumberSprite(n) {

  const size = 256;

  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;

  const ctx = canvas.getContext("2d");

  const gradient = ctx.createRadialGradient(
    size/2,
    size/2,
    10,
    size/2,
    size/2,
    size/2
  );

  gradient.addColorStop(0, "rgba(255,255,255,1)");
  gradient.addColorStop(0.4, "rgba(100,220,255,0.8)");
  gradient.addColorStop(1, "rgba(0,0,0,0)");

  ctx.fillStyle = gradient;

  ctx.beginPath();
  ctx.arc(size/2, size/2, size * 0.46, 0, Math.PI * 2);
  ctx.fill();

  ctx.font = "bold 120px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.fillStyle = "black";
  ctx.fillText(String(n), size/2, size/2);

  const texture = new THREE.CanvasTexture(canvas);

  const material = new THREE.SpriteMaterial({
    map: texture,
    transparent: true
  });

  const sprite = new THREE.Sprite(material);

  sprite.scale.set(3.2, 3.2, 3.2);

  sprite.userData.number = n;
  sprite.userData.collected = false;

  return sprite;
}

function spawnNumbers() {

  for (const orb of numberOrbs) {
    scene.remove(orb);
  }

  numberOrbs.length = 0;

  for (let n = 1; n <= 10; n++) {

    const orb = createNumberSprite(n);

    orb.position.set(
      (Math.random() - 0.5) * 40,
      (Math.random() - 0.5) * 20,
      -10 - Math.random() * 60
    );

    orb.userData.baseY = orb.position.y;
    orb.userData.phase = Math.random() * Math.PI * 2;

    numberOrbs.push(orb);

    scene.add(orb);
  }
}

//
// INPUT
//

const keys = new Set();

window.addEventListener("keydown", e => {
  keys.add(e.key.toLowerCase());
});

window.addEventListener("keyup", e => {
  keys.delete(e.key.toLowerCase());
});

let yaw = 0;
let pitch = 0;

let mouseDown = false;

renderer.domElement.addEventListener("pointerdown", () => {
  mouseDown = true;
});

window.addEventListener("pointerup", () => {
  mouseDown = false;
});

window.addEventListener("mousemove", e => {

  if (!running || !mouseDown) return;

  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;

  const limit = Math.PI / 2.5;

  pitch = Math.max(-limit, Math.min(limit, pitch));
});

//
// CLICK COLLECT
//

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

renderer.domElement.addEventListener("click", event => {

  if (!running) return;

  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const intersects = raycaster.intersectObjects(numberOrbs);

  if (!intersects.length) return;

  const orb = intersects[0].object;

  if (orb.userData.collected) return;

  const n = orb.userData.number;

  if (n === nextNumber) {

    orb.userData.collected = true;

    scene.remove(orb);

    collected++;
    nextNumber++;

    hudNext.textContent = nextNumber <= 10 ? nextNumber : "DONE";
    hudScore.textContent = `${collected} / 10`;

    if (collected >= 10) {

      running = false;

      menu.style.display = "flex";

      document.getElementById("panel").innerHTML = `
        <h1>You Win!</h1>
        <p>Penalty Time: ${penalty}s</p>
        <button onclick="location.reload()">PLAY AGAIN</button>
      `;
    }

  } else {

    penalty += 2;

    hudPenalty.textContent = penalty;
  }
});

//
// START GAME
//

function startGame() {

  running = true;

  nextNumber = 1;
  collected = 0;
  penalty = 0;

  hudNext.textContent = "1";
  hudScore.textContent = "0 / 10";
  hudPenalty.textContent = "0";

  player.position.set(0, 0, 6);

  yaw = 0;
  pitch = 0;

  spawnNumbers();

  menu.style.display = "none";
}

startBtn.addEventListener("click", startGame);

//
// LOOP
//

const clock = new THREE.Clock();

function animate() {

  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.033);

  stars.rotation.y += 0.0002;

  for (const orb of numberOrbs) {

    if (orb.userData.collected) continue;

    orb.position.y =
      orb.userData.baseY +
      Math.sin(performance.now() * 0.001 + orb.userData.phase) * 0.3;
  }

  if (running) {

    player.rotation.set(pitch, yaw, 0);

    const forward = new THREE.Vector3(0, 0, -1)
      .applyEuler(player.rotation)
      .normalize();

    const right = new THREE.Vector3(1, 0, 0)
      .applyEuler(player.rotation)
      .normalize();

    const move = new THREE.Vector3();

    if (keys.has("w")) move.add(forward);
    if (keys.has("s")) move.sub(forward);
    if (keys.has("a")) move.sub(right);
    if (keys.has("d")) move.add(right);

    const speed = keys.has("shift") ? 12 : 6;

    if (move.lengthSq() > 0) {
      move.normalize().multiplyScalar(speed * dt);
      player.position.add(move);
    }

    const desiredCamPos =
      player.position.clone().add(
        camOffset.clone().applyEuler(player.rotation)
      );

    camera.position.lerp(desiredCamPos, 0.08);

    camera.lookAt(
      player.position.clone().add(
        forward.clone().multiplyScalar(10)
      )
    );
  }

  renderer.render(scene, camera);
}

animate();

//
// RESIZE
//

window.addEventListener("resize", () => {

  camera.aspect = window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
